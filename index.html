<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>싱싱냉장고 - AI 스마트 식재료 & 레시피 관리</title>
  <!-- Google Fonts: Pretendard & Gowun Dodum -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
            },
            surface: '#F8FAFC',
          },
          fontFamily: {
            sans: ['Pretendard', 'sans-serif'],
          },
          boxShadow: {
            'soft': '0 10px 25px -5px rgba(0, 0, 0, 0.04), 0 8px 10px -6px rgba(0, 0, 0, 0.02)',
            'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.07)',
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #F8FAFC;
      font-family: 'Pretendard', sans-serif;
    }
    @keyframes pulse-subtle {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.02); opacity: 0.9; }
    }
    .animate-pulse-subtle {
      animation: pulse-subtle 2s infinite ease-in-out;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen pb-20 selection:bg-brand-500 selection:text-white">

  <!-- Navigation / Header -->
  <header class="glass-card sticky top-0 z-30 border-b border-slate-200/80 shadow-sm transition-all">
    <div class="max-w-5xl mx-auto px-5 py-3.5 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-brand-600 to-emerald-400 flex items-center justify-center text-white text-xl shadow-md shadow-brand-500/20">
          🌿
        </div>
        <div>
          <h1 class="text-xl font-bold text-slate-900 tracking-tight leading-none">싱싱냉장고</h1>
          <p class="text-[11px] text-slate-400 mt-0.5">Smart AI Refrigerator</p>
        </div>
      </div>
      <button id="openRecipeModalBtn" class="bg-gradient-to-r from-brand-600 to-emerald-500 hover:from-brand-700 hover:to-emerald-600 text-white font-semibold px-4 py-2.5 rounded-2xl shadow-lg shadow-brand-500/25 hover:shadow-brand-500/35 transition-all duration-200 flex items-center space-x-2 text-xs sm:text-sm active:scale-95">
        <span>✨ AI 맞춤 레시피</span>
        <span id="selectedCountBadge" class="bg-white text-brand-700 text-xs font-extrabold px-2 py-0.5 rounded-full hidden shadow-sm">0</span>
      </button>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-5 pt-8">

    <!-- D-3 긴급 소비 알림 바 -->
    <div id="urgentAlertBox" class="hidden mb-8 bg-gradient-to-r from-rose-500 via-orange-500 to-amber-500 text-white rounded-3xl p-5 shadow-xl shadow-rose-500/15 border border-white/20">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center space-x-2.5">
          <span class="text-xl bg-white/20 p-2 rounded-xl backdrop-blur-md">⚠️</span>
          <div>
            <h2 class="font-bold text-base tracking-tight">소비기한 임박 식재료</h2>
            <p class="text-xs text-white/80">3일 이내 우선 소비가 필요한 재료입니다.</p>
          </div>
        </div>
        <span class="text-xs font-semibold bg-white/20 backdrop-blur-md px-3 py-1.5 rounded-xl border border-white/20">Quick Cook</span>
      </div>
      <div id="urgentItemsList" class="flex flex-wrap gap-2 pt-1">
        <!-- JS로 dynamic 생성 -->
      </div>
    </div>

    <!-- 식재료 추가 카드 / 버튼 -->
    <section class="mb-8">
      <div class="bg-white rounded-3xl border border-slate-200/70 shadow-soft p-6 transition-all">
        <div class="flex justify-between items-center mb-5">
          <div class="flex items-center space-x-2">
            <span class="w-2 h-6 bg-brand-500 rounded-full"></span>
            <h2 class="text-base font-bold text-slate-900">식재료 신규 등록</h2>
          </div>
          <button id="toggleFormBtn" class="text-xs text-slate-400 hover:text-slate-600 font-medium transition-colors flex items-center gap-1">
            <span>접기/열기</span>
          </button>
        </div>

        <form id="addIngredientForm" class="space-y-4">
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3.5">
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1.5">식재료 이름 *</label>
              <input type="text" id="inputName" required placeholder="예: 두부, 계란" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl focus:bg-white focus:ring-2 focus:ring-brand-500 focus:border-transparent outline-none text-sm transition-all placeholder:text-slate-300">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1.5">유통기한 *</label>
              <input type="date" id="inputExpiry" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl focus:bg-white focus:ring-2 focus:ring-brand-500 focus:border-transparent outline-none text-sm transition-all text-slate-700">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1.5">보관 장소</label>
              <select id="inputStorage" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl focus:bg-white focus:ring-2 focus:ring-brand-500 focus:border-transparent outline-none text-sm transition-all text-slate-700">
                <option value="냉장">🧊 냉장</option>
                <option value="냉동">❄️ 냉동</option>
                <option value="실온">🧺 실온</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1.5">수량 / 단위</label>
              <input type="text" id="inputQuantity" placeholder="예: 1모, 500g" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl focus:bg-white focus:ring-2 focus:ring-brand-500 focus:border-transparent outline-none text-sm transition-all placeholder:text-slate-300">
            </div>
          </div>
          <div class="flex justify-end pt-2">
            <button type="submit" class="w-full sm:w-auto bg-slate-900 hover:bg-slate-800 text-white font-medium px-6 py-2.5 rounded-2xl shadow-md transition-all duration-150 text-xs sm:text-sm active:scale-95">
              + 등록 완료
            </button>
          </div>
        </form>
      </div>
    </section>

    <!-- 보관 장소 필터 탭 -->
    <section class="mb-6">
      <div class="flex space-x-1.5 bg-slate-200/50 p-1.5 rounded-2xl w-fit text-xs sm:text-sm font-medium">
        <button class="tab-btn active bg-white text-slate-900 font-semibold px-4 py-2 rounded-xl shadow-sm transition-all" data-tab="전체">전체 보기</button>
        <button class="tab-btn text-slate-500 hover:text-slate-800 px-4 py-2 rounded-xl transition-all" data-tab="냉장">🧊 냉장</button>
        <button class="tab-btn text-slate-500 hover:text-slate-800 px-4 py-2 rounded-xl transition-all" data-tab="냉동">❄️ 냉동</button>
        <button class="tab-btn text-slate-500 hover:text-slate-800 px-4 py-2 rounded-xl transition-all" data-tab="실온">🧺 실온</button>
      </div>
    </section>

    <!-- 식재료 리스트 카드 영역 -->
    <section>
      <div id="ingredientGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- JS로 dynamic 생성 -->
      </div>

      <!-- 빈 목록 상태 -->
      <div id="emptyState" class="hidden text-center py-20 bg-white/60 rounded-3xl border border-dashed border-slate-200/80">
        <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl text-slate-400">
          🧺
        </div>
        <p class="text-slate-600 font-semibold text-sm">보관 중인 식재료가 없습니다.</p>
        <p class="text-xs text-slate-400 mt-1">상단 양식을 통해 새로운 식재료를 채워보세요!</p>
      </div>
    </section>
  </main>

  <!-- AI 레시피 모달 팝업 -->
  <div id="recipeModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-3xl max-w-xl w-full max-h-[90vh] overflow-y-auto shadow-2xl p-6 sm:p-7 border border-slate-100 transition-all">
      <div class="flex justify-between items-center pb-4 border-b border-slate-100">
        <div class="flex items-center space-x-2">
          <span class="text-xl">✨</span>
          <h3 class="text-lg font-bold text-slate-900">AI 맞춤 레시피 생성</h3>
        </div>
        <button id="closeRecipeModalBtn" class="w-8 h-8 rounded-full hover:bg-slate-100 text-slate-400 hover:text-slate-600 flex items-center justify-center text-lg font-medium transition-colors">&times;</button>
      </div>

      <!-- 필터 설정 -->
      <div class="mt-5 p-4 bg-slate-50 rounded-2xl border border-slate-100 space-y-3.5">
        <p class="text-xs font-bold text-slate-700 tracking-wide uppercase">레시피 옵션 설정</p>
        
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
          <div>
            <label class="block text-[11px] text-slate-500 mb-1 font-semibold">🍽️ 요리 종류</label>
            <select id="recipeCategory" class="w-full text-xs p-2.5 bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-1 focus:ring-brand-500 text-slate-700">
              <option value="상관없음">🎲 AI 자유 추천</option>
              <option value="정식/식사">🍚 든든한 정식</option>
              <option value="간식/디저트">🥪 간편한 디저트</option>
              <option value="안주/야식">🍺 맛있는 안주</option>
              <option value="건강식/다이어트">🥗 다이어트 식단</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] text-slate-500 mb-1 font-semibold">🍳 난이도</label>
            <select id="recipeDifficulty" class="w-full text-xs p-2.5 bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-1 focus:ring-brand-500 text-slate-700">
              <option value="초보자용">초보자 (쉬움)</option>
              <option value="중급자용">중급자 (보통)</option>
              <option value="요리사용">요리사 (전문적)</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] text-slate-500 mb-1 font-semibold">⏱️ 조리 시간</label>
            <select id="recipeTime" class="w-full text-xs p-2.5 bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-1 focus:ring-brand-500 text-slate-700">
              <option value="15분 이내">15분 이내</option>
              <option value="30분 이내">30분 이내</option>
              <option value="상관없음">상관없음</option>
            </select>
          </div>
        </div>

        <div class="flex items-center space-x-2 pt-1">
          <input type="checkbox" id="urgentPriorityCheck" checked class="w-4 h-4 accent-brand-600 rounded-md cursor-pointer">
          <label for="urgentPriorityCheck" class="text-xs text-slate-700 font-medium cursor-pointer select-none">
            유통기한 임박 식재료 최우선 활용
          </label>
        </div>
      </div>

      <!-- 선택된 식재료 태그 목록 -->
      <div class="mt-4">
        <label class="block text-xs font-semibold text-slate-500 mb-1.5">선택된 식재료</label>
        <div id="selectedIngredientsList" class="flex flex-wrap gap-1.5 p-3 bg-slate-50 rounded-2xl min-h-[46px] border border-slate-100">
          <span class="text-xs text-slate-400">선택된 재료가 없습니다. 목록에서 선택해 주세요.</span>
        </div>
      </div>

      <!-- 생성 버튼 -->
      <button id="generateRecipeBtn" class="w-full mt-5 bg-gradient-to-r from-brand-600 to-emerald-500 hover:from-brand-700 hover:to-emerald-600 text-white font-semibold py-3.5 rounded-2xl shadow-lg shadow-brand-500/20 transition-all flex items-center justify-center space-x-2 text-sm active:scale-95">
        <span>👨‍🍳 AI 레시피 고안하기</span>
      </button>

      <!-- 결과 창 -->
      <div id="recipeResultContainer" class="mt-6 hidden">
        <hr class="border-slate-100 my-4">
        <div id="recipeLoading" class="hidden text-center py-8">
          <div class="inline-block animate-bounce text-3xl mb-2">🍳</div>
          <p class="text-xs font-bold text-brand-700">AI가 최고의 요리법을 계산하는 중입니다...</p>
        </div>
        <div id="recipeContent" class="text-slate-700 space-y-4 text-xs sm:text-sm leading-relaxed bg-emerald-50/40 p-5 rounded-2xl border border-emerald-100/60">
          <!-- AI 추천 레시피 결과 출력 -->
        </div>
      </div>
    </div>
  </div>

  <script>
    // 초기 샘플 데이터
    let ingredients = [
      { id: 1, name: '우유', expiry: getOffsetDate(2), storage: '냉장', quantity: '1팩', storageTip: '냉장고 안쪽 깊은 곳에 보관하세요.', checked: true },
      { id: 2, name: '두부', expiry: getOffsetDate(5), storage: '냉장', quantity: '1모', storageTip: '밀폐용기에 물을 자작하게 채워 보관하세요.', checked: true },
      { id: 3, name: '시금치', expiry: getOffsetDate(10), storage: '냉장', quantity: '1단', storageTip: '키친타월로 감싸 세워서 보관하세요.', checked: false },
      { id: 4, name: '닭가슴살', expiry: getOffsetDate(20), storage: '냉동', quantity: '500g', storageTip: '1회분씩 랩으로 밀봉 보관하세요.', checked: false },
      { id: 5, name: '식빵', expiry: getOffsetDate(-1), storage: '실온', quantity: '2장', storageTip: '남은 식빵은 즉시 냉동 보관하세요.', checked: false }
    ];

    let currentTab = '전체';

    function getOffsetDate(offsetDays) {
      const d = new Date();
      d.setDate(d.getDate() + offsetDays);
      return d.toISOString().split('T')[0];
    }

    function calculateDDay(expiryDateStr) {
      const today = new Date();
      today.setHours(0,0,0,0);
      const expiry = new Date(expiryDateStr);
      expiry.setHours(0,0,0,0);
      const diffTime = expiry - today;
      return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
    }

    // DOM Elements
    const ingredientGrid = document.getElementById('ingredientGrid');
    const emptyState = document.getElementById('emptyState');
    const urgentAlertBox = document.getElementById('urgentAlertBox');
    const urgentItemsList = document.getElementById('urgentItemsList');
    const addForm = document.getElementById('addIngredientForm');
    const openRecipeModalBtn = document.getElementById('openRecipeModalBtn');
    const closeRecipeModalBtn = document.getElementById('closeRecipeModalBtn');
    const recipeModal = document.getElementById('recipeModal');
    const selectedCountBadge = document.getElementById('selectedCountBadge');
    const selectedIngredientsList = document.getElementById('selectedIngredientsList');
    const generateRecipeBtn = document.getElementById('generateRecipeBtn');
    const recipeResultContainer = document.getElementById('recipeResultContainer');
    const recipeLoading = document.getElementById('recipeLoading');
    const recipeContent = document.getElementById('recipeContent');

    // Render Function
    function render() {
      // 1. 긴급 알림 바 (D-3 이하)
      const urgentItems = ingredients.filter(item => {
        const dday = calculateDDay(item.expiry);
        return dday <= 3 && dday >= 0;
      });

      if (urgentItems.length > 0) {
        urgentAlertBox.classList.remove('hidden');
        urgentItemsList.innerHTML = urgentItems.map(item => `
          <span class="bg-white/20 backdrop-blur-sm text-white text-xs px-3 py-1 rounded-full font-semibold border border-white/10">
            ${item.name} (${calculateDDay(item.expiry) === 0 ? 'D-Day' : 'D-' + calculateDDay(item.expiry)})
          </span>
        `).join('');
      } else {
        urgentAlertBox.classList.add('hidden');
      }

      // 2. 탭 필터링
      const filtered = ingredients.filter(item => {
        if (currentTab === '전체') return true;
        return item.storage === currentTab;
      });

      // 3. 카드 그리드 렌더링
      ingredientGrid.innerHTML = '';
      if (filtered.length === 0) {
        emptyState.classList.remove('hidden');
      } else {
        emptyState.classList.add('hidden');
        filtered.forEach(item => {
          const dday = calculateDDay(item.expiry);
          const cardEl = createCardElement(item, dday);
          ingredientGrid.appendChild(cardEl);
        });
      }

      // 4. 선택 카운트 배지
      const selectedCount = ingredients.filter(i => i.checked).length;
      if (selectedCount > 0) {
        selectedCountBadge.innerText = selectedCount;
        selectedCountBadge.classList.remove('hidden');
      } else {
        selectedCountBadge.classList.add('hidden');
      }
    }

    function createCardElement(item, dday) {
      const card = document.createElement('div');
      
      // 만료된 항목 스타일
      if (dday < 0) {
        card.className = "bg-slate-100/80 border border-slate-200 rounded-3xl p-5 flex justify-between items-center text-slate-400 opacity-70";
        card.innerHTML = `
          <div class="flex items-center space-x-3">
            <input type="checkbox" disabled class="rounded opacity-40">
            <div>
              <span class="line-through font-semibold text-slate-500">${item.name}</span>
              <span class="text-[10px] bg-slate-200 text-slate-600 px-2 py-0.5 rounded-md ml-2 font-bold">기한 만료</span>
            </div>
          </div>
          <button onclick="deleteItem(${item.id})" class="text-xs text-rose-500 hover:text-rose-700 transition-colors p-1.5">삭제</button>
        `;
        return card;
      }

      // 보관 장소별 태그 색상
      const storageColors = {
        '냉장': 'bg-blue-50 text-blue-600 border-blue-100',
        '냉동': 'bg-cyan-50 text-cyan-600 border-cyan-100',
        '실온': 'bg-amber-50 text-amber-600 border-amber-100'
      };

      // D-Day 상태별 스타일
      let badgeBg = "bg-emerald-50 text-emerald-700 border-emerald-100";
      let badgeText = `D-${dday}`;
      let warningStyle = "";

      if (dday <= 1) {
        badgeBg = "bg-rose-500 text-white font-bold shadow-sm shadow-rose-500/30";
        badgeText = dday === 0 ? " 오늘까지" : " D-1 임박";
        warningStyle = "border-rose-200 ring-2 ring-rose-500/10 animate-pulse-subtle";
      } else if (dday <= 3) {
        badgeBg = "bg-rose-50 text-rose-600 border-rose-100 font-semibold";
        badgeText = `D-${dday}`;
      } else if (dday <= 7) {
        badgeBg = "bg-amber-50 text-amber-700 border-amber-100 font-semibold";
      }

      card.className = `bg-white rounded-3xl border border-slate-100 p-5 shadow-soft hover:shadow-lg transition-all duration-200 ${warningStyle}`;
      card.innerHTML = `
        <div class="flex items-start justify-between mb-3">
          <div class="flex items-center space-x-3">
            <input type="checkbox" ${item.checked ? 'checked' : ''} onchange="toggleCheck(${item.id})" class="w-4 h-4 accent-brand-600 rounded-md cursor-pointer transition-transform active:scale-90">
            <div>
              <div class="flex items-center space-x-2">
                <h3 class="font-bold text-slate-800 text-base">${item.name}</h3>
                <span class="text-[10px] px-2 py-0.5 rounded-lg border font-medium ${storageColors[item.storage] || 'bg-slate-50 text-slate-600'}">${item.storage}</span>
              </div>
              <p class="text-xs text-slate-400 mt-0.5">${item.quantity || '수량 미지정'} · ${item.expiry}까지</p>
            </div>
          </div>
          <span class="text-xs px-2.5 py-1 rounded-xl border ${badgeBg}">
            ${badgeText}
          </span>
        </div>

        <div class="pt-3 border-t border-slate-100 flex justify-between items-center text-xs">
          <p class="text-slate-500 bg-slate-50 px-3 py-1.5 rounded-xl border border-slate-100 flex-1 mr-3 text-[11px] truncate">
            💡 ${item.storageTip || '밀폐하여 보관하세요.'}
          </p>
          <button onclick="deleteItem(${item.id})" class="text-slate-300 hover:text-rose-500 p-1 transition-colors">
            🗑️
          </button>
        </div>
      `;
      return card;
    }

    // Handlers
    function toggleCheck(id) {
      ingredients = ingredients.map(i => i.id === id ? { ...i, checked: !i.checked } : i);
      render();
    }

    function deleteItem(id) {
      ingredients = ingredients.filter(i => i.id !== id);
      render();
    }

    // Form Submit
    addForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('inputName').value.trim();
      const expiry = document.getElementById('inputExpiry').value;
      const storage = document.getElementById('inputStorage').value;
      const quantity = document.getElementById('inputQuantity').value.trim();

      if (!name || !expiry) return;

      const tips = {
        '냉장': '밀폐 용기에 넣어 0~5℃ 사이에서 보관하세요.',
        '냉동': '공기 접촉을 최소화하여 -18℃ 이하 보관하세요.',
        '실온': '직사광선을 피하고 서늘한 곳에 두세요.'
      };

      const newItem = {
        id: Date.now(),
        name,
        expiry,
        storage,
        quantity,
        storageTip: tips[storage] || '서늘한 곳에 보관하세요.',
        checked: true
      };

      ingredients.push(newItem);
      addForm.reset();
      render();
    });

    // Tab Change
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.tab-btn').forEach(b => {
          b.classList.remove('active', 'bg-white', 'text-slate-900', 'font-semibold', 'shadow-sm');
          b.classList.add('text-slate-500');
        });
        e.target.classList.add('active', 'bg-white', 'text-slate-900', 'font-semibold', 'shadow-sm');
        e.target.classList.remove('text-slate-500');
        currentTab = e.target.dataset.tab;
        render();
      });
    });

    // Modal Operations
    openRecipeModalBtn.addEventListener('click', () => {
      renderSelectedIngredientsList();
      recipeModal.classList.remove('hidden');
    });

    closeRecipeModalBtn.addEventListener('click', () => {
      recipeModal.classList.add('hidden');
    });

    function renderSelectedIngredientsList() {
      const selected = ingredients.filter(i => i.checked);
      if (selected.length === 0) {
        selectedIngredientsList.innerHTML = `<span class="text-xs text-slate-400">선택된 재료가 없습니다. 목록에서 체크박스를 선택해주세요.</span>`;
        return;
      }
      selectedIngredientsList.innerHTML = selected.map(item => `
        <span class="bg-brand-50 text-brand-700 text-xs px-2.5 py-1 rounded-xl font-semibold border border-brand-100 flex items-center gap-1">
          ${item.name} (${item.quantity || '적당량'})
        </span>
      `).join('');
    }

    // AI Recipe Generation Demo
    generateRecipeBtn.addEventListener('click', async () => {
      const selected = ingredients.filter(i => i.checked);
      if (selected.length === 0) {
        alert('레시피에 활용할 식재료를 최소 1개 이상 선택해 주세요!');
        return;
      }

      const category = document.getElementById('recipeCategory').value;
      const difficulty = document.getElementById('recipeDifficulty').value;
      const time = document.getElementById('recipeTime').value;

      recipeResultContainer.classList.remove('hidden');
      recipeLoading.classList.remove('hidden');
      recipeContent.innerHTML = '';

      const ingredientNames = selected.map(i => `${i.name}(${i.quantity || '적당량'})`).join(', ');

      try {
        await new Promise(res => setTimeout(res, 1500));

        const mainItem = selected[0].name;
        recipeContent.innerHTML = `
          <div class="space-y-3.5">
            <div class="flex justify-between items-start border-b border-emerald-200/60 pb-3">
              <div>
                <span class="text-[10px] font-bold text-brand-700 bg-brand-100/60 px-2 py-0.5 rounded-md uppercase tracking-wider">${category} 추천</span>
                <h4 class="text-base sm:text-lg font-bold text-slate-900 mt-1">🍳 ${mainItem} 풍미 가득 맞춤 요리</h4>
              </div>
              <span class="text-xs font-medium text-slate-500 bg-white px-2.5 py-1 rounded-lg border border-slate-100 shadow-sm">⏱️ ${time} · 🍳 ${difficulty}</span>
            </div>

            <p class="text-xs text-slate-600">
              선택하신 <strong class="text-slate-800">${ingredientNames}</strong>를 최우선으로 활용하여 균형 잡힌 맛을 살린 레시피입니다.
            </p>

            <div class="bg-white/80 p-3.5 rounded-2xl border border-emerald-100">
              <h5 class="font-bold text-xs text-slate-800 mb-1">🛒 필수 준비 재료</h5>
              <p class="text-xs text-slate-600">${ingredientNames}, 기본 조미료 (소금, 후추, 식용유 등)</p>
            </div>

            <div>
              <h5 class="font-bold text-xs text-slate-800 mb-2">👨‍🍳 조리 순서</h5>
              <ol class="list-decimal list-inside text-xs space-y-2 text-slate-600 leading-relaxed">
                <li>준비한 식재료(<strong class="text-slate-800">${ingredientNames}</strong>)를 알맞은 크기로 깨끗하게 손질합니다.</li>
                <li>달궈진 팬에 기름을 살짝 두르고, 주요 재료를 노릇하게 볶아 향을 냅니다.</li>
                <li>기호에 따라 간장이나 소금, 후추로 간을 맞춘 뒤 2~3분간 더 조리합니다.</li>
                <li>예쁜 그릇에 담아 완성합니다.</li>
              </ol>
            </div>
          </div>
        `;
      } catch (err) {
        recipeContent.innerHTML = `<p class="text-rose-500 text-xs">레시피를 생성하는 중에 문제가 발생했습니다.</p>`;
      } finally {
        recipeLoading.classList.add('hidden');
      }
    });

    // Toggle Form logic
    document.getElementById('toggleFormBtn').addEventListener('click', () => {
      addForm.classList.toggle('hidden');
    });

    // App Init
    render();
  </script>
</body>
</html>
